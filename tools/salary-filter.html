<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salary CSV Filter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e0ea;
      --primary: #2457d6;
      --primary-dark: #1740a8;
      --surface: #ffffff;
      --background: #f4f7fb;
      --success: #137333;
      --error: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      color: var(--ink);
      background: var(--background);
      font-family: Arial, sans-serif;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
    }

    .intro {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }

    .card {
      margin-bottom: 20px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 6px 18px rgba(23, 32, 51, 0.06);
    }

    .drop-zone {
      display: block;
      padding: 36px 24px;
      border: 2px dashed #9aadd1;
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .drop-zone:hover,
    .drop-zone.is-dragging {
      border-color: var(--primary);
      background: #f1f5ff;
    }

    .drop-zone strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 1.1rem;
    }

    input[type="file"] {
      display: none;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      padding: 11px 17px;
      border: 0;
      border-radius: 7px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #download-button {
      color: #fff;
      background: var(--primary);
    }

    #download-button:not(:disabled):hover {
      background: var(--primary-dark);
    }

    #reset-button {
      color: var(--ink);
      background: #e9edf4;
    }

    .status {
      min-height: 22px;
      margin: 16px 0 0;
      font-size: 0.95rem;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--error);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    th {
      color: #0d1d46;
      background: #e9efff;
      font-weight: 700;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Filter salary data</h1>
    <p class="intro">
      Select a CSV file to keep only rows where the salary is greater than 1000.
      Your file stays in this browser and is not uploaded anywhere.
    </p>

    <section class="card">
      <label class="drop-zone" id="drop-zone" for="csv-file">
        <strong>Choose a CSV file</strong>
        Click here or drag and drop your file
        <input id="csv-file" type="file" accept=".csv,text/csv">
      </label>
      <div class="controls">
        <button id="download-button" type="button" disabled>Download filtered CSV</button>
        <button id="reset-button" type="button">Clear</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card hidden" id="results-section">
      <h2>Filtered results</h2>
      <div class="table-wrap" id="table-container"></div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var threshold = 1000;
      var fileInput = document.getElementById("csv-file");
      var dropZone = document.getElementById("drop-zone");
      var downloadButton = document.getElementById("download-button");
      var resetButton = document.getElementById("reset-button");
      var status = document.getElementById("status");
      var resultsSection = document.getElementById("results-section");
      var tableContainer = document.getElementById("table-container");
      var filteredCsv = "";
      var selectedFileName = "filtered_salary_data.csv";

      function setStatus(message, type) {
        status.textContent = message;
        status.className = "status" + (type ? " " + type : "");
      }

      function parseCsv(text) {
        var rows = [];
        var row = [];
        var value = "";
        var inQuotes = false;

        for (var i = 0; i < text.length; i += 1) {
          var character = text[i];
          var nextCharacter = text[i + 1];

          if (character === '"') {
            if (inQuotes && nextCharacter === '"') {
              value += '"';
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (character === "," && !inQuotes) {
            row.push(value);
            value = "";
          } else if ((character === "\n" || character === "\r") && !inQuotes) {
            if (character === "\r" && nextCharacter === "\n") {
              i += 1;
            }
            row.push(value);
            if (row.some(function (cell) { return cell.trim() !== ""; })) {
              rows.push(row);
            }
            row = [];
            value = "";
          } else {
            value += character;
          }
        }

        if (value !== "" || row.length > 0) {
          row.push(value);
          if (row.some(function (cell) { return cell.trim() !== ""; })) {
            rows.push(row);
          }
        }
        return rows;
      }

      function csvCell(value) {
        var stringValue = String(value);
        return /[",\r\n]/.test(stringValue)
          ? '"' + stringValue.replace(/"/g, '""') + '"'
          : stringValue;
      }

      function formatSalary(value) {
        var normalized = String(value).trim().replace(/[$€£,\s]/g, "");
        return Number(normalized);
      }

      function renderTable(headers, rows) {
        var table = document.createElement("table");
        var head = document.createElement("thead");
        var headerRow = document.createElement("tr");
        var body = document.createElement("tbody");

        headers.forEach(function (header) {
          var cell = document.createElement("th");
          cell.scope = "col";
          cell.textContent = header;
          headerRow.appendChild(cell);
        });
        head.appendChild(headerRow);
        table.appendChild(head);

        rows.forEach(function (dataRow) {
          var row = document.createElement("tr");
          headers.forEach(function (_, index) {
            var cell = document.createElement("td");
            cell.textContent = dataRow[index] || "";
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
        table.appendChild(body);
        tableContainer.replaceChildren(table);
      }

      function processFile(file) {
        if (!file || (!/\.csv$/i.test(file.name) && file.type !== "text/csv")) {
          setStatus("Please choose a CSV file.", "error");
          return;
        }

        var reader = new FileReader();
        reader.onload = function () {
          var rows = parseCsv(String(reader.result || "").replace(/^\uFEFF/, ""));
          if (rows.length < 1) {
            setStatus("The CSV file does not contain any data.", "error");
            return;
          }

          var headers = rows[0].map(function (header) { return header.trim(); });
          var salaryIndex = headers.findIndex(function (header) {
            return header.toLowerCase() === "salary";
          });

          if (salaryIndex === -1) {
            setStatus('Could not find a column named "salary".', "error");
            return;
          }

          var matchingRows = rows.slice(1).filter(function (dataRow) {
            return formatSalary(dataRow[salaryIndex] || "") > threshold;
          });

          filteredCsv = [headers].concat(matchingRows)
            .map(function (dataRow) { return dataRow.map(csvCell).join(","); })
            .join("\r\n") + "\r\n";
          selectedFileName = file.name.replace(/\.csv$/i, "") + "_salary_over_1000.csv";
          renderTable(headers, matchingRows);
          resultsSection.classList.remove("hidden");
          downloadButton.disabled = false;
          setStatus(
            matchingRows.length + " matching row" + (matchingRows.length === 1 ? "" : "s") +
            " found from " + rows.length + " data row" + (rows.length === 2 ? "" : "s") + ".",
            "success"
          );
        };
        reader.onerror = function () {
          setStatus("The file could not be read. Please try again.", "error");
        };
        reader.readAsText(file);
      }

      fileInput.addEventListener("change", function () {
        processFile(fileInput.files[0]);
      });

      ["dragenter", "dragover"].forEach(function (eventName) {
        dropZone.addEventListener(eventName, function (event) {
          event.preventDefault();
          dropZone.classList.add("is-dragging");
        });
      });
      ["dragleave", "drop"].forEach(function (eventName) {
        dropZone.addEventListener(eventName, function (event) {
          event.preventDefault();
          dropZone.classList.remove("is-dragging");
        });
      });
      dropZone.addEventListener("drop", function (event) {
        processFile(event.dataTransfer.files[0]);
      });

      downloadButton.addEventListener("click", function () {
        var blob = new Blob([filteredCsv], { type: "text/csv;charset=utf-8;" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = selectedFileName;
        link.click();
        URL.revokeObjectURL(url);
      });

      resetButton.addEventListener("click", function () {
        fileInput.value = "";
        filteredCsv = "";
        downloadButton.disabled = true;
        resultsSection.classList.add("hidden");
        tableContainer.replaceChildren();
        setStatus("");
      });
    }());
  </script>
</body>
</html>
